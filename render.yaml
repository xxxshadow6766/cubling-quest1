# Render Blueprint for Cubling Quest (Dashboard → New → Blueprint → pick this repo).
# One web service = game client + API + WebSockets on one origin, with a persistent disk for saves.
services:
  - type: web
    name: cubling-quest
    runtime: node
    # Persistent disks need a paid instance type. On the free plan, remove the `disk:` block —
    # but then ALL saves are wiped on every deploy/restart (see README).
    plan: starter
    # --include=dev: the build tools (vite, typescript, esbuild) are devDependencies and
    # npm would skip them because NODE_ENV=production is set below.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: cubling-saves
      mountPath: /var/data
      sizeGB: 1
